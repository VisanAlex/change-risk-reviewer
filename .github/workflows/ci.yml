name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 24
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.os == 'ubuntu-latest'
        run: npm run benchmark
      - run: npm pack --dry-run --ignore-scripts

  standards:
    name: Plugin standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify committed skill runtime
        run: |
          npm run build:skill
          git diff --exit-code -- skills/review/scripts/analyze.mjs
      - name: Validate Agent Skill
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
          skills-ref validate skills/review
      - name: Validate Claude plugin
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.66
          claude plugin validate .
      - run: npm run validate:packaging
